spring:
  application:
    name: TicketRush

  # Each request runs on a virtual thread; blocking JDBC calls no longer hold an OS thread. See docs/adr/0002.
  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false